name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to rebuild and publish, e.g. v0.1.0"
        required: true

permissions: {}

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.event.inputs.tag || '' }}

  release:
    needs: checks
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: [checks, release]
    if: >-
      ${{
        always()
        && needs.checks.result == 'success'
        && (
          github.event_name == 'workflow_dispatch'
          || needs.release.outputs.released == 'true'
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || needs.release.outputs.tag }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.inputs.tag || needs.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.inputs.tag || needs.release.outputs.tag }}
            type=semver,pattern={{major}},value=${{ github.event.inputs.tag || needs.release.outputs.tag }},enable=${{ !startsWith(github.event.inputs.tag || needs.release.outputs.tag, 'v0.') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
